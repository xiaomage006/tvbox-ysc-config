name: Auto Build Live Playlist
"on":
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/merge_live.py"
      - "live/core.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: live-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge upstream public streams
        run: python scripts/merge_live.py

      - name: Commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/tv.txt
          if git diff --cached --quiet; then
            echo "::notice::no change"
          else
            git commit -m "chore: auto build live playlist $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
